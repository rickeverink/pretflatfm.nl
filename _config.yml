# Timetable — start/end are for display, *_min are minutes-after-midnight
# (past-midnight slots continue past 1440, e.g. 01:00 -> 1500) used for the
# client-side "now playing" highlight. `photo` is a placeholder — drop a real
# photo in imgs/timetable/ using the same filename to replace it, no code changes needed.
#
# Photo spec (timetable): shown cropped to 4:3, max ~320px wide in the layout.
# Aanleveren als: JPG, 4:3 beeldverhouding, ca. 1200x900px, bij voorkeur onder 300-500KB.
# Onderwerp liever gecentreerd in beeld, want de rand kan afgesneden worden bij het bijsnijden.
timetable:
  - start: "09:00"
    end: "11:00"
    start_min: 540
    end_min: 660
    show: "TGI(P)F"
    host: "Reyer van Harten"
